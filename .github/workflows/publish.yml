name: Publish to npm

# Releases: bump package.json version, tag, push.
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Auth is GitHub OIDC (npm "trusted publishing") — no NPM_TOKEN secret.
# Trusted publisher on npmjs.com points at corbinGuo/scripttag-audit +
# workflow filename `publish.yml`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# OIDC token minting is what authenticates the publish.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing (OIDC) needs npm >= 11.5.1; runners can bundle
      # older CLIs, so pin the 11.x line explicitly (npm@12 changes install
      # behavior; no need to chase majors here).
      # No registry-url here on purpose: setup-node would write a placeholder
      # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, which makes npm prefer
      # (broken) token auth over the OIDC fallback — the registry masks that
      # as 404 on PUT. npm defaults to registry.npmjs.org; package.json
      # publishConfig pins it too.
      - run: npm install -g npm@11
      - run: npm ci
      # --provenance: trusted publishing handles AUTH via OIDC; the flag is
      # what generates the signed provenance attestation (npm view ... dist.attestations)
      - run: npm publish --provenance
