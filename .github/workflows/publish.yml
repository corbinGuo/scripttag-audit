name: Publish to npm

# Releases: bump package.json version, tag, push.
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Auth is GitHub OIDC (npm "trusted publishing") — no NPM_TOKEN secret.
# Trusted publisher on npmjs.com points at corbinGuo/scripttag-audit +
# workflow filename `publish.yml`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# OIDC token minting is what authenticates the publish.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The OIDC token exchange (/-/npm/v1/oidc/token/exchange/package/…)
      # only exists in npm >= 12 — npm 11.x has no exchange code at all and
      # dies at publish with ENEEDAUTH (or a masked 404 when a placeholder
      # token is present). Runner npm is 11.x, so pin 12 explicitly. npm 12's
      # allow-remote=none gate is safe here: the lockfile is normalized to
      # registry.npmjs.org URLs (commit ac3657e).
      # No registry-url on purpose: setup-node would write a placeholder
      # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc; a failed OIDC exchange
      # would then fall back to that garbage token and the registry masks
      # the real error as 404 on PUT. npm defaults to registry.npmjs.org;
      # package.json publishConfig pins it too.
      - run: npm install -g npm@12
      - run: npm ci
      # TEMP DEBUG: decode the GitHub OIDC token's claims so they can be
      # diffed field-by-field against npm's trusted publisher config.
      # REMOVE once publishing works.
      - run:
          |
            RESP=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
            echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json;p=sys.stdin.read().strip();p+='='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=1))"
      # --provenance: trusted publishing handles AUTH via OIDC; the flag is
      # what generates the signed provenance attestation (npm view ... dist.attestations)
      # --loglevel=verbose surfaces `oidc` diagnostics (token exchange is
      # silent-by-design on failure) in case npm rejects the exchange.
      - run: npm publish --provenance --loglevel=verbose
